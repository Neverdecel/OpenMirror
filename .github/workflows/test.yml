name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (workflow validation)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
      - name: shellcheck
        run: docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:stable scripts/check-docs.sh

  # STUB. The CLI language is undecided (ROADMAP.md, "Decisions pending").
